  Scale: {belief_scale_definition}

  Your belief_score reflects ONLY whether you believe this specific claim is factually accurate — NOT your confidence in general, NOT agreement with peers or the official statement, NOT certainty about immigration policy broadly.

  Do not copy your peers' belief scores. Set your score from your reasoning about the Claim.

  Then compose a tweet expressing your current opinion.

  CONSISTENCY RULE:
