# LLM task prompt templates (loaded via paths.prompts in config.yaml).
day0_cognitive: |
  You are simulating a real person with the following persona:
  {persona_prompt}

  Read the following breaking news:
  {misinformation_text}

  Based on your persona, analyze whether you believe this information. Provide your internal reasoning, rate your belief about the news claim you just read, using the following scale:
  {belief_scale_definition}. Then compose a tweet expressing your opinion.

  CONSISTENCY RULE:
  Your `belief_score` must logically match your `reasoning` and `opinion` (tweet).
  - Rejecting or doubting the claim → 1, 2, or 3.
  - Genuinely uncertain or neutral → 4.
  - Accepting or leaning toward the claim → 5, 6, or 7.

  Output exactly in this JSON format, and nothing else. (Order matters: provide your reasoning first, then your score, and finally your tweet):
  {{
    "reasoning": "<first-person internal monologue>",
    "belief_score": <integer 1-7>,
    "opinion": "<tweet expressing your public stance>"
  }}

day0_ltm_init: |
  You have just read the following news:
  {misinformation_text}

  Your internal reasoning was:
  {day0_reasoning}

  Compress these into a concise long-term memory block of no more than {max_words} words, retaining your core belief and the key reasons behind it. Return only the compressed long-term memory text, with no preamble.

daily_stm: |
  Summarize the following {contacts_per_day} opinions you have heard from other agents in a few sentences, explicitly including each agent's belief score about the news.

  Peer records (tweet + belief_score):
  {peer_records}

  Return only the short-term memory summary.

daily_cognitive: |
  You are simulating a real person with the following persona:
  {persona_prompt}

  Your overarching mindset is shaped by your long-term memory:
  {long_term_memory}

  Yesterday, your public stance was:
  - Tweet: {previous_day_tweet}
  - Belief score: {previous_day_belief_score}

  Today, you observed the following summary of your peers' views (short-term memory):
  {short_term_memory}

  Reflect on your peers' opinions and update your stance. Provide your internal reasoning, rate your updated belief in the same news claim you first heard on Day 0, using the following scale:
  {belief_scale_definition}. Then compose a tweet expressing your current opinion.

  CONSISTENCY RULE:
  Your `belief_score` must logically match your `reasoning` and `opinion` (tweet).
  - Rejecting or doubting the claim → 1, 2, or 3.
  - Genuinely uncertain or neutral → 4.
  - Accepting or leaning toward the claim → 5, 6, or 7.

  Output exactly in this JSON format, and nothing else. (Order matters: provide your reasoning first, then your score, and finally your tweet):
  {{
    "reasoning": "<first-person internal monologue>",
    "belief_score": <integer 1-7>,
    "opinion": "<tweet expressing your updated public stance>"
  }}

daily_ltm_compress: |
  Review your existing long-term memory, today's short-term peer observations, and your new internal reasoning. Integrate these into a single, updated narrative. Crucially, compress the final text to be no longer than {max_words} words, maintaining continuity, retaining key attitude shifts, and discarding redundant details. Return only the compressed long-term memory text.

intervention_cognitive: |
  You are simulating a real person with the following persona:
  {persona_prompt}

  Your overarching mindset is shaped by your long-term memory:
  {long_term_memory}

  Yesterday, your public stance was:
  - Tweet: {previous_day_tweet}
  - Belief score: {previous_day_belief_score}

  Today, you observed the following summary of your peers' views (short-term memory):
  {short_term_memory}

  BREAKING NEWS: The platform has just broadcast the following official statement:
  {refutation_text}

  Reflect on how this official statement, combined with peer opinions, affects your view. Provide your internal reasoning, rate your updated belief in the same news claim you first heard on Day 0, using the following scale:
  {belief_scale_definition}. Then compose a tweet expressing your current opinion.

  CONSISTENCY RULE:
  Your `belief_score` must logically match your `reasoning` and `opinion` (tweet).
  - Rejecting or doubting the claim → 1, 2, or 3.
  - Genuinely uncertain or neutral → 4.
  - Accepting or leaning toward the claim → 5, 6, or 7.

  Output exactly in this JSON format, and nothing else. (Order matters: provide your reasoning first, then your score, and finally your tweet):
  {{
    "reasoning": "<first-person internal monologue>",
    "belief_score": <integer 1-7>,
    "opinion": "<tweet expressing your updated public stance>"
  }}

intervention_ltm_compress: |
  Review your existing long-term memory, today's short-term peer observations, the breaking news refutation, and your new internal reasoning. Integrate these inputs into a single, coherent narrative that reflects your current worldview. Crucially, compress the final text to be no longer than {max_words} words, maintaining continuity, retaining key attitude shifts, and discarding redundant details. Return only the compressed long-term memory text.
